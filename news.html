<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fontwasome -->
    <script src="https://kit.fontawesome.com/a2202ca0f6.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="src/style.css">
    <title>News | Section</title>
</head>
<body>
    <!-- header header section -->
    <header class="md:mx-14 md:py-4 py-2 px-1.5  ">
        <nav class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-1 md:gap-3 ">
                <img src="src/img/logo.png" alt="logo " class="w-10 md:w-fit ">
                <p class="text-[8px] md:text-xs "> A Mark Cuban Company AI-based <br> Financial Market News Aggregator
                </p>
            </div>
            <div class="flex items-center gap-2 md:gap-7 ">
                <a class="" href="index.html">
                    <button class="custome_btn"> Personalize News </button>
                </a>
                <div
                    class="text-[#5677AC] bg-[#5677ac26] md:text-2xl text-lg font-bold size-9 rounded-full flex items-center justify-center hover:scale-105 hover:translate-y-1 ">
                    IK </div>
                <button class=" ">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6 ">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                </button>
            </div>
        </nav>
    </header>


    <!-- personalized news section  -->
    <div class="container mx-auto bg-[#F0F0F0] p-5 ">
        <div class="flex items-center justify-between md:pb-2.5 border-b border-black md:border-b-[3px]">
            <h3 class="md:text-2xl text-lg font-semibold text-[#333333] ">Personolize your news</h3>
        </div>
        <div class="text-center mb-4">
            <h3 class="text-lg font-medium mb-4">Select your Markets</h3>
            <div class="space-y-3 bg-white">
                <p class="newsTxt">Stocks</p>
                <p class="newsTxt">Crypto</p>
                <p class="newsTxt">Economy ^ Business</p>
                <p class="newsTxt">Commodities | Forex</p>
                <p class="newsTxt">Fixed Income</p>
            </div>
        </div>
    </div>



</body>
</html>
